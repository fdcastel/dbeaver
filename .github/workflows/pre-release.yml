name: Pre-Release

on:
  push:
    branches: [pre-release]
  workflow_dispatch:

permissions:
  contents: write

env:
  MAVEN_OPTS: -Xmx2048m

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout dbeaver
        uses: actions/checkout@v4
        with:
          path: dbeaver

      - name: Checkout dbeaver-common
        uses: actions/checkout@v4
        with:
          repository: dbeaver/dbeaver-common
          path: dbeaver-common

      - name: Checkout dbeaver-jdbc-libsql
        uses: actions/checkout@v4
        with:
          repository: dbeaver/dbeaver-jdbc-libsql
          path: dbeaver-jdbc-libsql

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: dbeaver/product/aggregate
        run: mvn package -Pproduct-dbeaver-ce -DskipTests -B --no-transfer-progress

      - name: Package release artifacts
        run: |
          VERSION="17.0.0-pre.${{ github.run_number }}"
          PRODUCT_DIR="dbeaver/product/community/target/products/org.jkiss.dbeaver.core.product"

          # Linux
          for arch in x86_64 aarch64; do
            tar -czf "dbeaver-ce-${VERSION}-linux-${arch}.tar.gz" -C "${PRODUCT_DIR}/linux/gtk/${arch}" .
          done

          # Windows
          for arch in x86_64 aarch64; do
            ( cd "${PRODUCT_DIR}/win32/win32/${arch}" && zip -qr "${GITHUB_WORKSPACE}/dbeaver-ce-${VERSION}-windows-${arch}.zip" . )
          done

          # macOS
          for arch in x86_64 aarch64; do
            tar -czf "dbeaver-ce-${VERSION}-macos-${arch}.tar.gz" -C "${PRODUCT_DIR}/macosx/cocoa/${arch}" .
          done

      - name: Package P2 repository
        run: |
          VERSION="17.0.0-pre.${{ github.run_number }}"
          PRODUCT_DIR="dbeaver/product/community/target/products/org.jkiss.dbeaver.core.product/linux/gtk/x86_64/dbeaver"

          # Create a P2 repository from the product's features and plugins using the Eclipse publisher
          java -jar "${PRODUCT_DIR}/plugins"/org.eclipse.equinox.launcher_*.jar \
            -application org.eclipse.equinox.p2.publisher.FeaturesAndBundlesPublisher \
            -metadataRepository "file:$(pwd)/p2-repo" \
            -artifactRepository "file:$(pwd)/p2-repo" \
            -source "${PRODUCT_DIR}" \
            -publishArtifacts \
            -compress

          tar -czf "dbeaver-ce-${VERSION}-p2-repository.tar.gz" -C p2-repo .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v17.0.0-pre.${{ github.run_number }}
          name: DBeaver CE v17.0.0-pre.${{ github.run_number }}
          prerelease: true
          body: |
            Pre-release build from the `pre-release` branch.
          files: |
            dbeaver-ce-*.tar.gz
            dbeaver-ce-*.zip

      - name: Trigger UI tests
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UI_TESTS_PAT }}
          repository: fdcastel/dbeaver-firebird-ui-test
          event-type: dbeaver-prerelease
          client-payload: '{"tag": "v17.0.0-pre.${{ github.run_number }}"}'
